<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>NEURAL//DECK</title>
    <script>
      try {
        var raw = localStorage.getItem("neural_deck_ui_prefs_v1");
        if (raw && JSON.parse(raw).theme === "light") {
          document.documentElement.classList.remove("dark");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#EEF2F8");
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Pixel-art cyber deck app for AI-assisted brainstorming with branching idea cards, creative skill cartridges, splice mashups, convergence briefs, and an anti-pattern graveyard."
    />
    <meta property="og:title" content="NEURAL//DECK" />
    <meta
      property="og:description"
      content="Pixel-art cyber deck app for AI-assisted brainstorming with branching idea cards, creative skill cartridges, splice mashups, convergence briefs, and an anti-pattern graveyard."
    />
    <meta name="theme-color" content="#080A12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEURAL//DECK" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body class="antialiased selection:bg-[#00F0FF]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
